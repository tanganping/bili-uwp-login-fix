name: Build Bili.Uwp (login fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Fetch official source
        uses: actions/checkout@v4
        with:
          repository: Richasy/Bili.Uwp
          ref: main

      - name: Apply login fix
        shell: pwsh
        run: |
          $b64 = ""
          [IO.File]::WriteAllBytes("$PWD/fix.patch", [Convert]::FromBase64String($b64))
          git apply -p1 fix.patch
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git diff --stat

      - name: Configure pagefile
        uses: al-cheb/configure-pagefile-action@v1.2
        with:
          minimum-size: 32GB
          maximum-size: 32GB
          disk-root: "C:"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Add UWP component group to VS
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -property installationPath
          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          Write-Host "VS at: $vsPath"
          & $setup modify --installPath $vsPath --add Microsoft.VisualStudio.ComponentGroup.UWP.Support --quiet --norestart --nocache --wait
          $code = $LASTEXITCODE
          Write-Host "setup exit code: $code"
          if ($code -ne 0 -and $code -ne 3010) { exit 1 }

      - name: Create signing certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=云之幻" -KeyUsage DigitalSignature -FriendlyName "Bili UWP Sideload" -KeyExportPolicy Exportable -CertStoreLocation "Cert:\CurrentUser\My" -NotAfter (Get-Date).AddYears(3) -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
          $p = ConvertTo-SecureString -String "bili-fix-2026" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "${{ github.workspace }}\sign.pfx" -Password $p | Out-Null
          "THUMB=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "new cert thumb: $($cert.Thumbprint)"

      - name: Build (Release x64, sideload)
        shell: pwsh
        run: |
          msbuild Bili.Uwp.sln /restore /p:Configuration=Release /p:Platform=x64 /p:AppxBundlePlatforms="x64" /p:AppxPackageDir=${{ github.workspace }}\out\ /p:PackageCertificateKeyFile=${{ github.workspace }}\sign.pfx /p:PackageCertificatePassword=bili-fix-2026 /p:PackageCertificateThumbprint=$env:THUMB /p:BuildMode=SideloadOnly /p:UapAppxPackageBuildMode=SideloadOnly
          exit $LASTEXITCODE

      - name: Export signing cert
        shell: pwsh
        run: |
          $cert = Get-ChildItem "Cert:\CurrentUser\My\$env:THUMB"
          $cert | Export-Certificate -FilePath "${{ github.workspace }}\BiliFix.cer" -Type CERT
          Write-Host "Cert subject: $($cert.Subject) notafter: $($cert.NotAfter)"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Bili-UWP-login-fixed
          path: |
            **/*.msixbundle
            **/*.msix
            BiliFix.cer
          if-no-files-found: error
