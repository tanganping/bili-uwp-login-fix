name: Build Bili.Uwp (login fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Fetch official source
        uses: actions/checkout@v4
        with:
          repository: Richasy/Bili.Uwp
          ref: main

      - name: Apply login fix
        shell: pwsh
        run: |
          $b64 = ""
          [IO.File]::WriteAllBytes("$PWD/fix.patch", [Convert]::FromBase64String($b64))
          git apply -p1 fix.patch
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git diff --stat

      - name: Configure pagefile
        uses: al-cheb/configure-pagefile-action@v1.2
        with:
          minimum-size: 32GB
          maximum-size: 32GB
          disk-root: "C:"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Add UWP component group to VS
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -property installationPath
          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          Write-Host "VS at: $vsPath"
          & $setup modify --installPath $vsPath --add Microsoft.VisualStudio.ComponentGroup.UWP.Support --quiet --norestart --nocache --wait
          $code = $LASTEXITCODE
          Write-Host "setup exit code: $code"
          if ($code -ne 0 -and $code -ne 3010) { exit 1 }

      - name: Build (Release x64, sideload)
        shell: pwsh
        run: |
          msbuild Bili.Uwp.sln /restore /p:Configuration=Release /p:Platform=x64 /p:AppxBundlePlatforms="x64" /p:AppxPackageDir=out\ /p:PackageCertificateKeyFile=App_TemporaryKey.pfx /p:BuildMode=SideloadOnly /p:UapAppxPackageBuildMode=SideloadOnly
          exit $LASTEXITCODE

      - name: Export signing cert
        shell: pwsh
        run: |
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2("src\App\App_TemporaryKey.pfx", "")
          $cert | Export-Certificate -FilePath "${{ github.workspace }}\BiliFix.cer" -Type CERT
          Write-Host "Cert subject: $($cert.Subject)"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Bili-UWP-login-fixed
          path: |
            out/**/*.msixbundle
            out/**/*.msix
            BiliFix.cer
          if-no-files-found: error
